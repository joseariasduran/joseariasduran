<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo degradado oscuro estilo GitHub / TokyoNight -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Degradado de acento para línea y elementos gráficos -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Degradado suave para el área bajo la curva de pronóstico -->
    <linearGradient id="areaGrad" x1="0" y1="60" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Patrón de cuadrícula sutil -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363D" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Contenedor principal con bordes redondeados -->
  <rect width="1200" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="280" rx="14" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="278" rx="13" stroke="#30363D" stroke-width="1.5" />

  <!-- Barra lateral izquierda de acento -->
  <rect x="48" y="68" width="5" height="144" rx="2.5" fill="url(#accentGrad)" />

  <!-- Etiqueta superior (Kicker) -->
  <text x="72" y="86" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5">
    DATA ANALYTICS • PREDICTIVE MODELING • OPERATIONS
  </text>

  <!-- Nombre Principal -->
  <text x="70" y="138" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    José de Jesús Arias Durán
  </text>

  <!-- Rol / Subtítulo -->
  <text x="72" y="176" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
    Business Intelligence Analyst  <tspan fill="#38BDF8" font-weight="700">|</tspan>  Data Scientist  <tspan fill="#818CF8" font-weight="700">|</tspan>  Industrial Engineer
  </text>

  <!-- Stack Pills Minimalistas -->
  <g transform="translate(72, 200)">
    <rect x="0" y="0" width="92" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="46" y="17" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">Power BI</text>

    <rect x="102" y="0" width="76" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="140" y="17" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">Python</text>

    <rect x="188" y="0" width="58" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="217" y="17" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">SQL</text>

    <rect x="256" y="0" width="128" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="320" y="17" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">ML & GenAI</text>
  </g>

  <!-- Gráfico decorativo abstracto de BI & Forecasting (Derecha) -->
  <g transform="translate(820, 45)">
    <!-- Barras de BI sutiles -->
    <rect x="30" y="140" width="24" height="50" rx="4" fill="#1F2937" stroke="#30363D" />
    <rect x="70" y="115" width="24" height="75" rx="4" fill="#1F2937" stroke="#30363D" />
    <rect x="110" y="128" width="24" height="62" rx="4" fill="#1F2937" stroke="#30363D" />
    <rect x="150" y="88" width="24" height="102" rx="4" fill="#1F2937" stroke="#30363D" />
    <rect x="190" y="96" width="24" height="94" rx="4" fill="#1F2937" stroke="#30363D" />
    <rect x="230" y="62" width="24" height="128" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" />
    <rect x="270" y="42" width="24" height="148" rx="4" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.5" />

    <!-- Área bajo curva -->
    <path d="M 42 135 C 70 110, 95 125, 122 118 C 148 110, 165 82, 202 88 C 235 92, 255 52, 282 36 L 282 190 L 42 190 Z" fill="url(#areaGrad)" />

    <!-- Línea de tendencia / pronóstico -->
    <path d="M 42 135 C 70 110, 95 125, 122 118 C 148 110, 165 82, 202 88 C 235 92, 255 52, 282 36" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Nodos de datos -->
    <circle cx="42" cy="135" r="4" fill="#0D1117" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="122" cy="118" r="4" fill="#0D1117" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="202" cy="88" r="4" fill="#0D1117" stroke="#818CF8" stroke-width="2.5" />
    <circle cx="282" cy="36" r="5" fill="#C084FC" stroke="#0D1117" stroke-width="2" />
  </g>
</svg>